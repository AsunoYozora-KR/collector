<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="카드첩">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#262B33">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>인물 카드첩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 아이패드 가로 한 화면 고정 — 왼쪽 인물 기둥(태그·이름·대표사진·기본정보) 30% + 오른쪽 구분 3x3 격자. 좁은 화면에선 세로로 쌓임
   색: 검정 대신 짙은 회청색 바탕 — 밝은 사진이 와도 대비가 과하지 않게 */
:root{
  --bg:#262B33; --surface:#30363F; --well:#2A3038; --sunk:#3A414B; --ink:#EFEBE3; --ink-2:#C3C8CF; --ink-3:#959DA8;
  --line:#454D58; --accent:#E6BE78; --accent-line:#75653F; --on-accent:#2A2112;
  --danger:#F09A8F; --danger-soft:#4A3230; --scrim:rgba(12,14,18,.6); --cap:rgba(22,25,31,.74);
  --f-name:"Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.icon{width:38px;padding:0;font-size:20px;line-height:1}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger-soft);border-color:var(--danger)}
.btn[aria-disabled="true"]{opacity:.35;pointer-events:none}

.gbar{display:flex;flex-direction:column;gap:10px}
.row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-name);font-weight:800;font-size:22px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.count{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.search{flex:1 1 220px;min-width:0;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;font-size:16px}
.search::placeholder{color:var(--ink-3)}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:46px;z-index:15;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:200px;display:flex;flex-direction:column;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.menu button{text-align:left;background:none;border:0;padding:10px 12px;border-radius:6px;cursor:pointer;font-size:14px}
.menu button:hover{background:var(--surface)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-size:11px;font-weight:500}
.seltags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.linkbtn{background:none;border:0;padding:4px 6px;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.chip{flex:0 0 auto;min-width:max-content;white-space:nowrap;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] b{color:var(--on-accent);opacity:.8}
.chip .x{font-size:15px;line-height:1}
.chip.add{border-style:dashed;color:var(--ink-2);background:transparent}
.chip.lg{height:36px;padding:0 13px;font-size:14px}
.chip.create{height:36px;padding:0 13px;border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:500}
.tagedit{display:flex;flex-wrap:wrap;gap:6px}
.tsheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(720px,100%);height:min(640px,100%);display:flex;flex-direction:column;gap:12px;padding:18px}
.thead{display:flex;align-items:center;gap:8px}
.ttitle{font-family:var(--f-name);font-weight:800;font-size:20px;margin:0}
.tlist{flex:1;min-height:0;overflow:auto;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tlist.rows{flex-direction:column;flex-wrap:nowrap;gap:0}
.trow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tname{font-weight:500;color:var(--accent);overflow-wrap:anywhere}
.tcount{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--ink-3)}
.tedit{flex:1 1 200px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tmsg{font-size:12px;color:var(--ink-2);min-height:1.2em}
.tempty{color:var(--ink-2);margin:8px 0;font-size:14px;width:100%}
.tfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.syncbtn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:12px;cursor:pointer;white-space:nowrap}
.syncbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.syncbtn[data-state="ok"] .dot{background:#7FC8A0}
.syncbtn[data-state="busy"] .dot{background:var(--accent)}
.syncbtn[data-state="error"] .dot,.syncbtn[data-state="offline"] .dot{background:var(--danger)}
.syncbtn[data-state="error"]{color:var(--danger);border-color:var(--danger)}
.ssheet{height:auto;max-height:100%;overflow:auto;width:min(560px,100%)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:500;color:var(--ink-2)}
.fhint{font-size:12px;color:var(--ink-3);margin:0;line-height:1.55}
.ferr{font-size:13px;color:var(--danger);margin:0;min-height:1.3em}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.tinfo{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere;min-width:0}
.note{margin:0;font-size:13px;color:var(--danger);background:var(--danger-soft);padding:8px 12px;border-radius:8px}

.gridview{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;padding-bottom:24px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.tile .ph{aspect-ratio:4/5;max-width:100%;border-radius:12px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.tile:hover .ph{border-color:var(--ink-3)}
.ph img,.main img,.si img,.big img{width:100%;height:100%;object-fit:cover;display:block}
.tile .nm{font-family:var(--f-name);font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tg{font-size:12px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-4px}
.sentinel{height:1px}
.empty{max-width:520px;margin:10vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{font-family:var(--f-name);font-weight:800;font-size:24px;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--ink-2)}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.noresult{color:var(--ink-2);margin:24px 0}

.cardview{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.cbar{display:flex;align-items:center;gap:8px}
.cbar .nav{display:flex;align-items:center;gap:6px}
.pos{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.grow{flex:1}
.stage{flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;grid-template-columns:minmax(0,30%) minmax(0,1fr);gap:20px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage.editing{user-select:auto;-webkit-user-select:auto}
.left{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.ctags{display:flex;flex-wrap:wrap;gap:6px;max-height:64px;overflow:hidden;min-height:24px}
.ctags span{font-size:12px;font-weight:500;color:var(--accent);border:1px solid var(--accent-line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.cname{font-family:var(--f-name);font-weight:800;font-size:clamp(26px,3.2vw,38px);line-height:1.15;margin:2px 0 4px;letter-spacing:-.01em;overflow-wrap:anywhere}
.main{flex:1;min-height:120px;border-radius:12px;background:var(--sunk);overflow:hidden;position:relative}
.noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px;text-align:center;padding:8px}
.si,.big{position:relative}
.summary{background:var(--well);border-radius:12px;padding:12px 14px;max-height:28%;overflow:auto;min-height:0}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink-3);margin-bottom:2px}
.summary p{margin:0;font-family:var(--f-name);font-size:15px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.sections{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:14px;min-height:0;min-width:0}
.slot{display:flex;flex-direction:column;gap:5px;min-height:0;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.slot .si{flex:1;min-height:0;border-radius:12px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.slot:hover .si{border-color:var(--ink-3)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:9px 12px;background:var(--cap);display:flex;gap:8px;align-items:baseline;min-width:0}
.cap b{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--accent);flex:none}
.cap span{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.slot.vacant{cursor:default}
.slot.vacant .si{background:transparent;border:1px dashed var(--line)}
.slot.add .si{background:transparent;border:1px dashed var(--ink-3);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);font-size:13px}
.slot.add .plus{font-size:26px;line-height:1;font-weight:400}
.slot.add .cnt{font-family:var(--f-mono);font-weight:500;color:var(--ink-3);font-size:12px}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:12px;color:var(--ink-3)}

.in{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:16px}
.in::placeholder{color:var(--ink-3)}
.in-name{font-family:var(--f-name);font-weight:700;font-size:22px}
textarea.in{resize:none;line-height:1.6}
.imgbar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap}

.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(900px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;padding:18px}
.big{aspect-ratio:1;max-width:100%;background:var(--well);border-radius:12px;overflow:hidden}
.big img{object-fit:contain}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.stitle{font-family:var(--f-name);font-weight:800;font-size:24px;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.sdesc{margin:0;font-family:var(--f-name);font-size:16px;color:var(--ink-2);line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:#20252C;padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}

@keyframes inR{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
.stage.inR{animation:inR .2s ease-out}
.stage.inL{animation:inL .2s ease-out}
@media (prefers-reduced-motion: reduce){.stage.inR,.stage.inL{animation:none}}

@media (max-width:700px),(max-height:520px){
  .cardview{overflow:auto}
  .stage{flex:none;display:flex;flex-direction:column;padding:14px}
  .main{flex:none;aspect-ratio:4/5;max-height:70vh;max-width:100%}
  .summary{max-height:none}
  .sections{grid-template-rows:none}
  .slot .si{flex:none;aspect-ratio:1;max-width:100%}
  .slot.vacant{display:none}
  .sheet{grid-template-columns:minmax(0,1fr)}
  .brand{font-size:19px}
}
</style>

</head>
<body>
<div id="app">
  <header id="gridBar" class="gbar">
    <div class="row1">
      <div class="brand">인물 카드첩 <span id="count" class="count"></span></div>
      <button id="syncBtn" class="syncbtn" type="button" data-state="off"><span class="dot" aria-hidden="true"></span><span id="syncText">동기화 꺼짐</span></button>
      <input id="q" class="search" type="search" placeholder="이름 검색 · 초성도 돼요 (ㄱㅎㄹ)" autocomplete="off" enterkeyhint="search" aria-label="이름 검색">
      <button id="tagBtn" class="btn" type="button">태그 <span id="tagBadge" class="badge" hidden></span></button>
      <button id="newBtn" class="btn primary" type="button">새 카드</button>
      <div class="menuwrap">
        <button id="menuBtn" class="btn icon" type="button" aria-label="메뉴" aria-expanded="false">⋯</button>
        <div id="menu" class="menu" hidden>
          <button type="button" data-act="sync">동기화 설정</button>
          <button type="button" data-act="export">백업 파일로 내보내기</button>
          <button type="button" data-act="import">백업 파일 가져오기</button>
          <button type="button" data-act="seed">예시 카드 넣기</button>
        </div>
      </div>
    </div>
    <div id="selTags" class="seltags" aria-label="고른 태그" hidden></div>
    <p id="memNote" class="note" hidden>이 화면에서는 기기 저장소를 쓸 수 없어서, 창을 닫으면 카드가 사라져요.</p>
  </header>

  <main id="gridView" class="gridview">
    <div id="empty" class="empty" hidden>
      <h2>첫 인물 카드를 만들어 보세요</h2>
      <p>대표 사진, 이름, 짧은 기본 정보를 적고, 사진 한 장씩 붙는 구분을 최대 9개까지 더할 수 있어요.</p>
      <div class="row">
        <button class="btn primary" type="button" data-act="new">카드 만들기</button>
        <button class="btn" type="button" data-act="seed">예시 카드 넣어 보기</button>
      </div>
    </div>
    <p id="noResult" class="noresult" hidden>조건에 맞는 카드가 없어요.</p>
    <div id="gallery" class="gallery"></div>
    <div id="sentinel" class="sentinel" hidden></div>
  </main>

  <section id="cardView" class="cardview" hidden>
    <div class="cbar">
      <button id="backBtn" class="btn" type="button">‹ 목록</button>
      <div class="nav">
        <button id="prevBtn" class="btn icon" type="button" aria-label="이전 카드">‹</button>
        <span id="pos" class="pos"></span>
        <button id="nextBtn" class="btn icon" type="button" aria-label="다음 카드">›</button>
      </div>
      <span class="grow"></span>
      <span id="delWrap"></span>
      <button id="editBtn" class="btn" type="button">편집</button>
    </div>
    <article id="stage" class="stage"></article>
  </section>
</div>

<div id="scrim" class="scrim" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="구분 보기"></div></div>
<div id="tagScrim" class="scrim" hidden><div id="tagSheet" class="tsheet" role="dialog" aria-modal="true" aria-label="태그"></div></div>
<div id="syncScrim" class="scrim" hidden><div id="syncSheet" class="tsheet ssheet" role="dialog" aria-modal="true" aria-label="동기화 설정"></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<input id="file" type="file" accept="image/*" hidden>
<input id="importFile" type="file" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';
const MAX_SECTIONS = 9;
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids) if (k != null && k !== false) e.append(k);
  return e;
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

/* ---------- 저장소: 카드 정보와 사진을 따로 보관 ----------
   cards  : 글 정보만 (작아서 한 번에 전부 불러와도 빠름)
   images : 원본 크기 사진 (카드를 열 때만 꺼냄)
   thumbs : 작은 사진 (목록·구분 칸용)                        */
const Store = (() => {
  let dbp = null, mem = null;
  const wrap = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('person-cards', 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('cards')) d.createObjectStore('cards', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('images')) d.createObjectStore('images');
        if (!d.objectStoreNames.contains('thumbs')) d.createObjectStore('thumbs');
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }).catch(() => { mem = { cards: new Map(), images: new Map(), thumbs: new Map(), meta: new Map() }; return null; });
    return dbp;
  }
  function run(stores, mode, fn) {
    return open().then(d => {
      if (!d) return fn(null);
      return new Promise((res, rej) => {
        const t = d.transaction(stores, mode);
        let out;
        try { out = fn(t); } catch (e) { rej(e); return; }
        t.oncomplete = () => res(out);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error);
      });
    });
  }
  return {
    get memory() { return !!mem; },
    async allCards() { const d = await open(); return d ? wrap(d.transaction('cards').objectStore('cards').getAll()) : [...mem.cards.values()]; },
    putCard: c => run(['cards'], 'readwrite', t => t ? t.objectStore('cards').put(c) : mem.cards.set(c.id, structuredClone(c))),
    deleteCard: (id, ids) => run(['cards', 'images', 'thumbs'], 'readwrite', t => {
      if (!t) { mem.cards.delete(id); ids.forEach(i => { mem.images.delete(i); mem.thumbs.delete(i); }); return; }
      t.objectStore('cards').delete(id);
      ids.forEach(i => { t.objectStore('images').delete(i); t.objectStore('thumbs').delete(i); });
    }),
    putImage: (id, full, thumb) => run(['images', 'thumbs'], 'readwrite', t => {
      if (!t) { mem.images.set(id, full); mem.thumbs.set(id, thumb); return; }
      t.objectStore('images').put(full, id); t.objectStore('thumbs').put(thumb, id);
    }),
    deleteImages: ids => run(['images', 'thumbs'], 'readwrite', t => {
      if (!t) { ids.forEach(i => { mem.images.delete(i); mem.thumbs.delete(i); }); return; }
      ids.forEach(i => { t.objectStore('images').delete(i); t.objectStore('thumbs').delete(i); });
    }),
    async getBlob(kind, id) { const d = await open(); return d ? wrap(d.transaction(kind).objectStore(kind).get(id)) : (mem[kind].get(id) || null); },
    async getMeta(k) { const d = await open(); return d ? wrap(d.transaction('meta').objectStore('meta').get(k)) : (mem.meta.get(k) ?? null); },
    putMeta: (k, v) => run(['meta'], 'readwrite', t => t ? t.objectStore('meta').put(v, k) : mem.meta.set(k, structuredClone(v))),
    delMeta: k => run(['meta'], 'readwrite', t => t ? t.objectStore('meta').delete(k) : mem.meta.delete(k))
  };
})();

/* ---------- 사진 주소 캐시: 최근 것만 기억하고 오래된 건 풀어줌 ---------- */
const Urls = (() => {
  const caches = { images: new Map(), thumbs: new Map() };
  const limits = { images: 12, thumbs: 240 };
  const pending = new Map();
  function get(kind, id) {
    if (!id) return Promise.resolve(null);
    const c = caches[kind];
    if (c.has(id)) { const u = c.get(id); c.delete(id); c.set(id, u); return Promise.resolve(u); }
    const k = kind + ':' + id;
    if (pending.has(k)) return pending.get(k);
    const p = Store.getBlob(kind, id).then(b => {
      pending.delete(k);
      if (!b) return null;
      const u = URL.createObjectURL(b);
      c.set(id, u);
      while (c.size > limits[kind]) { const [oid, ou] = c.entries().next().value; c.delete(oid); URL.revokeObjectURL(ou); }
      return u;
    }).catch(() => { pending.delete(k); return null; });
    pending.set(k, p);
    return p;
  }
  function drop(id) { for (const c of Object.values(caches)) if (c.has(id)) { URL.revokeObjectURL(c.get(id)); c.delete(id); } }
  function clear() { for (const c of Object.values(caches)) { c.forEach(u => URL.revokeObjectURL(u)); c.clear(); } }
  return { get, drop, clear };
})();

/* ---------- 사진 줄이기: 원본 1600px, 작은 사진 480px ---------- */
function loadImg(blob) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = () => res({ im, u });
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('bad image')); };
    im.src = u;
  });
}
function resize(im, max, q) {
  const s = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(im.naturalWidth * s));
  c.height = Math.max(1, Math.round(im.naturalHeight * s));
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', q));
}
async function addImage(blob) {
  const { im, u } = await loadImg(blob);
  try {
    const full = await resize(im, 1600, 0.82);
    const thumb = await resize(im, 480, 0.78);
    const id = uid();
    await Store.putImage(id, full, thumb);
    return id;
  } finally { URL.revokeObjectURL(u); }
}
function removeImages(ids) {
  ids = ids.filter(Boolean);
  if (!ids.length) return;
  ids.forEach(Urls.drop);
  Store.deleteImages(ids).catch(() => {});
  if (Sync.cfg) { Sync.state.pendingImages.push(...ids); saveSyncState(); }
}

/* ---------- 메모리 속 상태와 색인 ----------
   cards    : id → 카드
   keys     : id → 검색용 이름(공백 제거, 소문자) + 초성
   tagIndex : 태그 → 그 태그를 가진 카드 id 묶음
   sorted   : 이름순 정렬된 카드 목록                     */
const S = { cards: new Map(), keys: new Map(), idxTags: new Map(), tagIndex: new Map(), sorted: [], visible: [], q: '', tags: new Set(), curId: null, editing: false, sheet: null };
const collator = new Intl.Collator('ko', { numeric: true });
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const norm = s => (s || '').toLowerCase().replace(/\s+/g, '');
function chosung(s) {
  let o = '';
  for (const ch of s) { const n = ch.charCodeAt(0) - 0xAC00; o += (n >= 0 && n < 11172) ? CHO[Math.floor(n / 588)] : ch; }
  return o;
}
function addToIndex(c) {
  const n = norm(c.name);
  S.keys.set(c.id, { n, c: chosung(n) });
  for (const t of c.tags) { let s = S.tagIndex.get(t); if (!s) S.tagIndex.set(t, s = new Set()); s.add(c.id); }
  S.idxTags.set(c.id, c.tags.slice());
}
function removeFromIndex(id) {
  S.keys.delete(id);
  for (const t of S.idxTags.get(id) || []) { const s = S.tagIndex.get(t); if (s) { s.delete(id); if (!s.size) S.tagIndex.delete(t); } }
  S.idxTags.delete(id);
}
function reindex(c) { removeFromIndex(c.id); addToIndex(c); }
function resort() { S.sorted = [...S.cards.values()].sort((a, b) => collator.compare(a.name, b.name)); }
/* 여러 태그를 고르면 "모두 가진 카드"만 남김. 카드 수가 적은 태그부터 확인해서 빨리 걸러냄 */
function computeVisible() {
  for (const t of [...S.tags]) if (!S.tagIndex.has(t)) S.tags.delete(t);
  const q = norm(S.q);
  const byCho = /^[ㄱ-ㅎ]+$/.test(q);
  const sets = [...S.tags].map(t => S.tagIndex.get(t)).sort((a, b) => a.size - b.size);
  const out = [];
  outer: for (const c of S.sorted) {
    for (const s of sets) if (!s.has(c.id)) continue outer;
    if (q) { const k = S.keys.get(c.id); if (!(byCho ? k.c.includes(q) : k.n.includes(q))) continue; }
    out.push(c);
  }
  S.visible = out;
}
const cleanTag = s => (s || '').replace(/#/g, '').replace(/\s+/g, '').slice(0, 20);
/* 대소문자·띄어쓰기만 다른 태그는 같은 태그로 봄 → 오타성 중복 방지 */
function findTag(raw) {
  const k = norm(cleanTag(raw));
  if (!k) return null;
  for (const t of S.tagIndex.keys()) if (norm(t) === k) return t;
  return null;
}
const tagMatches = (t, q) => !q || (/^[ㄱ-ㅎ]+$/.test(q) ? chosung(norm(t)).includes(q) : norm(t).includes(q));
const allTagsSorted = () => [...S.tagIndex.entries()].sort((a, b) => b[1].size - a[1].size || collator.compare(a[0], b[0]));

/* ---------- 자동 저장: 입력 후 0.35초 뒤 그 카드 하나만 저장 ---------- */
const saveTimers = new Map();
function touch(c) {
  c.updatedAt = Date.now();
  clearTimeout(saveTimers.get(c.id));
  saveTimers.set(c.id, setTimeout(() => flush(c.id), 350));
}
function flush(id) {
  clearTimeout(saveTimers.get(id)); saveTimers.delete(id);
  const c = S.cards.get(id);
  return c ? Store.putCard(c).then(() => scheduleSync(4000), () => toast('저장하지 못했어요. 기기 저장 공간을 확인해 주세요.')) : Promise.resolve();
}
const flushAll = () => Promise.all([...saveTimers.keys()].map(flush));

/* ---------- 작은 UI 도우미 ---------- */
let toastT;

function manageRow(t, n) {

function toggleCardTag(c, t) {

/* 태그 이름 바꾸기: 그 태그를 가진 카드만 색인에서 바로 찾아 고침 */
function renameTag(old, neu) {
  const ex = findTag(neu);

  if (target === old) return;
  const ids = [...(S.tagIndex.get(old) || [])];
  for (const id of ids) {
    const c = S.cards.get(id);
    if (!c) continue;
    c.tags = [...new Set(c.tags.map(x => x === old ? target : x))];
    touch(c); reindex(c);
  }
  if (S.tags.delete(old)) S.tags.add(target);
  toast(ex && ex !== old ? `#${old}를 #${target}에 합쳤어요 (${ids.length}장).` : `#${old} → #${target} (${ids.length}장)`);
}

async function exportAll() {
  await flushAll();

  const name = `인물카드첩-${new Date().toISOString().slice(0, 10)}.json`;

  }

async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('백업 파일을 읽지 못했어요.'); return; }
  if (!data || data.app !== 'person-cards' || !Array.isArray(data.cards)) { toast('인물 카드첩 백업 파일이 아니에요.'); return; }
  toast('가져오는 중…', 60000);
  let added = 0, updated = 0;
  try {
    for (const c of data.cards) {
      if (!c || !c.id) continue;
      const mine = S.cards.get(c.id);
      if (mine && (mine.updatedAt || 0) >= (c.updatedAt || 0)) continue;
      for (const id of [c.mainImage, ...(c.sections || []).map(s => s.image)]) {
        if (!id || !data.images || !data.images[id]) continue;
        const full = b64ToBlob(data.images[id]);
        const { im, u } = await loadImg(full);
        try { await Store.putImage(id, full, await resize(im, 480, 0.78)); } finally { URL.revokeObjectURL(u); }
      }
      const card = { id: c.id, name: c.name || '이름 없음', tags: Array.isArray(c.tags) ? c.tags : [], summary: c.summary || '', mainImage: c.mainImage || null, sections: (c.sections || []).slice(0, MAX_SECTIONS), createdAt: c.createdAt || Date.now(), updatedAt: c.updatedAt || Date.now() };
      await Store.putCard(card);
      if (mine) { removeFromIndex(mine.id); updated++; } else added++;
      S.cards.set(card.id, card); addToIndex(card);
    }
  } catch (e) { toast('가져오는 도중 멈췄어요. 저장 공간을 확인해 주세요.'); }
  resort(); showGrid();
  toast(`새 카드 ${added}장, 갱신 ${updated}장을 가져왔어요.`);
}

function placeholder(text, hue, tall) {
  const c = document.createElement('canvas');
  c.width = 900; c.height = tall ? 1125 : 900;
  const g = c.getContext('2d');
  g.fillStyle = `hsl(${hue} 28% 82%)`; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = `hsl(${hue} 30% 72%)`;
  g.beginPath(); g.arc(c.width * 0.78, c.height * 0.22, c.width * 0.32, 0, Math.PI * 2); g.fill();
  g.fillStyle = `hsl(${hue} 34% 24%)`;
  g.font = `700 ${tall ? 120 : 84}px "Gowun Batang", serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, c.width / 2, c.height * 0.58);
  g.font = '500 34px "IBM Plex Mono", monospace';
  g.fillText('예시 사진', c.width / 2, c.height * 0.58 + (tall ? 120 : 90));
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

/* ---------- 동기화: 비공개 깃허브 레포를 원본으로 ----------
   레포 구조
     meta.json          암호 확인용 정보 (소금값 + 확인 문장. 카드 내용은 없음)
     cards/<id>.bin     카드 하나 = 파일 하나 (암호화)
     images/<id>.bin    사진 한 장 = 파일 하나 (암호화, 한 번 올리면 안 바뀜)
   바뀐 것 찾기: 깃허브가 파일마다 붙이는 "지문(sha)"을 기억해 두고, 다른 것만 주고받음
   충돌: 나중에 고친 쪽(updatedAt이 큰 쪽)이 이김                                      */
const te = new TextEncoder(), td = new TextDecoder();
const Sync = { cfg: null, key: null, state: null, running: false, again: false, timer: null, lastError: '' };
function b64(buf) {

  return btoa(s);
}
function unb64(str) { const bin = atob(String(str).replace(/\s/g, '')); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}

  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);

}

}
const fail = m => { const e = new Error(m); e.userMsg = m; return e; };
async function gh(method, path, body, cfg = Sync.cfg) {
  const r = await fetch('https://api.github.com/repos/' + cfg.repo + path, {
    method, cache: 'no-store',
    headers: Object.assign({ Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined

  if (!r.ok) { const e = new Error('github ' + r.status); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
function explain(e) {
  if (e && e.userMsg) return e.userMsg;
  if (e && e.status === 401) return '열쇠(토큰)가 맞지 않거나 기간이 끝났어요. 새 열쇠를 넣어 주세요.';
  if (e && e.status === 403) return '열쇠에 이 레포 권한이 없어요. Contents를 Read and write로 했는지 확인해 주세요.';
  if (e && e.status === 404) return '레포를 찾을 수 없어요. 레포 이름과, 열쇠를 만들 때 고른 레포를 확인해 주세요.';
  if (e && e.name === 'OperationError') return '데이터를 풀지 못했어요. 암호 비밀번호를 확인해 주세요.';
  if (e && e.name === 'TypeError') return '깃허브에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
  return '동기화 중 문제가 생겼어요. 잠시 뒤 다시 해 보세요.';

  b.dataset.state = state;
  const at = Sync.state && Sync.state.lastAt ? new Date(Sync.state.lastAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) : '';
  $('#syncText').textContent = { off: '동기화 꺼짐', busy: '동기화 중…', ok: at ? `동기화됨 · ${at}` : '동기화됨', offline: '오프라인 · 나중에 올라가요', error: '동기화 문제' }[state];
  Sync.lastError = state === 'error' ? (msg || '') : '';
  if (!$('#syncScrim').hidden) renderSyncSheet();
}
function scheduleSync(ms) {
  if (!Sync.cfg) return;
  clearTimeout(Sync.timer);
  Sync.timer = setTimeout(runSync, ms);
}
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) await fn(items[i++]); }));
}
const imagesOf = c => [c.mainImage, ...c.sections.map(s => s.image)].filter(Boolean);
async function readBlob(sha) { const r = await gh('GET', '/git/blobs/' + sha); return unseal(unb64(r.content)); }
async function writeBlob(bytes) { const r = await gh('POST', '/git/blobs', { content: b64(await seal(bytes)), encoding: 'base64' }); return r.sha; }
function cleanCard(c) {
  return { id: c.id, name: c.name || '이름 없음', tags: Array.isArray(c.tags) ? c.tags : [], summary: c.summary || '', mainImage: c.mainImage || null,
    sections: (Array.isArray(c.sections) ? c.sections : []).slice(0, MAX_SECTIONS).map(s => ({ id: s.id || uid(), title: s.title || '', desc: s.desc || '', image: s.image || null })),
    createdAt: c.createdAt || Date.now(), updatedAt: c.updatedAt || Date.now() };
}
async function dropLocalCard(c) {
  const ids = imagesOf(c);
  clearTimeout(saveTimers.get(c.id)); saveTimers.delete(c.id);
  await Store.deleteCard(c.id, ids);
  ids.forEach(Urls.drop);
  removeFromIndex(c.id); S.cards.delete(c.id);
}
async function pull(rc, ri) {
  const st = Sync.state, pend = new Set(st.pendingCards);
  let changed = false;
  for (const [id, sha] of rc) {
    if (pend.has(id)) continue;
    const known = st.synced[id];
    if (known && known.sha === sha) continue;
    const remote = cleanCard(JSON.parse(td.decode(await readBlob(sha))));
    const local = S.cards.get(id);
    if (local && (local.updatedAt || 0) > remote.updatedAt) { st.synced[id] = { sha, u: remote.updatedAt }; continue; }
    const missing = [];
    for (const imgId of imagesOf(remote)) if (ri.has(imgId) && !(await Store.getBlob('thumbs', imgId))) missing.push(imgId);
    await pool(missing, 3, async imgId => {
      const full = new Blob([await readBlob(ri.get(imgId))], { type: 'image/jpeg' });
      const { im, u } = await loadImg(full);
      try { await Store.putImage(imgId, full, await resize(im, 480, 0.78)); } finally { URL.revokeObjectURL(u); }
    });
    await Store.putCard(remote);
    if (local) {
      const keep = new Set(imagesOf(remote));
      const gone = imagesOf(local).filter(x => !keep.has(x));
      if (gone.length) { gone.forEach(Urls.drop); await Store.deleteImages(gone); }
      removeFromIndex(id);
    }
    S.cards.set(id, remote); addToIndex(remote);
    st.synced[id] = { sha, u: remote.updatedAt };
    changed = true;
  }
  for (const id of Object.keys(st.synced)) {
    if (rc.has(id)) continue;
    const local = S.cards.get(id);
    if (local && (local.updatedAt || 0) > st.synced[id].u) { delete st.synced[id]; continue; }
    if (local) { await dropLocalCard(local); changed = true; }
    delete st.synced[id];
  }
  return changed;
}
async function push(head, treeSha, rc, ri) {
  const st = Sync.state, entries = [], newShas = {};
  const dirty = [...S.cards.values()].filter(c => !st.synced[c.id] || (c.updatedAt || 0) > st.synced[c.id].u);
  const need = new Set();
  for (const c of dirty) for (const id of imagesOf(c)) if (!ri.has(id)) need.add(id);
  await pool([...need], 3, async id => {
    const b = await Store.getBlob('images', id);
    if (b) entries.push({ path: `images/${id}.bin`, mode: '100644', type: 'blob', sha: await writeBlob(new Uint8Array(await b.arrayBuffer())) });
  });
  await pool(dirty, 3, async c => {
    const json = JSON.stringify(cleanCard(c)), u = c.updatedAt || 0;
    const sha = await writeBlob(te.encode(json));
    newShas[c.id] = { sha, u };
    entries.push({ path: `cards/${c.id}.bin`, mode: '100644', type: 'blob', sha });
  });
  for (const id of new Set(st.pendingCards)) if (rc.has(id)) entries.push({ path: `cards/${id}.bin`, mode: '100644', type: 'blob', sha: null });
  const inUse = new Set(); for (const c of S.cards.values()) imagesOf(c).forEach(x => inUse.add(x));
  for (const id of new Set(st.pendingImages)) if (ri.has(id) && !inUse.has(id)) entries.push({ path: `images/${id}.bin`, mode: '100644', type: 'blob', sha: null });
  if (entries.length) {
    const tree = await gh('POST', '/git/trees', { base_tree: treeSha, tree: entries });
    const commit = await gh('POST', '/git/commits', { message: `동기화 ${new Date().toISOString()}`, tree: tree.sha, parents: [head] });
    try { await gh('PATCH', '/git/refs/heads/' + encodeURIComponent(Sync.cfg.branch), { sha: commit.sha, force: false }); }
    catch (e) { if (e.status === 422 || e.status === 409) return 'retry'; throw e; }
  }
  Object.assign(st.synced, newShas);
  for (const id of st.pendingCards) delete st.synced[id];
  st.pendingCards = []; st.pendingImages = [];
  return 'done';
}
function afterPull() {
  resort(); computeVisible();
  if (!$('#gridView').hidden) { const y = $('#gridView').scrollTop; renderSelTags(); renderGallery(); $('#gridView').scrollTop = y; }
  else if (!S.editing && !S.sheet && !TP.mode) { if (S.cards.has(S.curId)) renderCard(); else showGrid(); }
}
async function runSync() {
  if (!Sync.cfg || !Sync.key) return;
  if (Sync.running) { Sync.again = true; return; }
  if (!navigator.onLine) { setSync('offline'); return; }
  Sync.running = true; setSync('busy');
  let changed = false;
  try {
    await flushAll();
    let result = 'retry';
    for (let attempt = 0; attempt < 3 && result === 'retry'; attempt++) {
      const ref = await gh('GET', '/git/ref/heads/' + encodeURIComponent(Sync.cfg.branch));
      const head = ref.object.sha;
      const commit = await gh('GET', '/git/commits/' + head);
      const tree = await gh('GET', `/git/trees/${commit.tree.sha}?recursive=1`);
      const rc = new Map(), ri = new Map();
      for (const t of tree.tree) {
        if (t.type !== 'blob') continue;
        let m = /^cards\/([^/]+)\.bin$/.exec(t.path); if (m) { rc.set(m[1], t.sha); continue; }
        m = /^images\/([^/]+)\.bin$/.exec(t.path); if (m) ri.set(m[1], t.sha);
      }
      if (await pull(rc, ri)) changed = true;
      result = await push(head, commit.tree.sha, rc, ri);
    }
    if (result === 'retry') throw fail('다른 기기와 동시에 저장하려다 밀렸어요. 잠시 뒤 다시 할게요.');
    Sync.state.lastAt = Date.now();
    saveSyncState();
    setSync('ok');
  } catch (e) {
    saveSyncState();
    setSync(e && e.name === 'TypeError' && !navigator.onLine ? 'offline' : 'error', explain(e));
  } finally {
    Sync.running = false;
    if (changed) afterPull();
    if (Sync.again) { Sync.again = false; scheduleSync(1000); }
  }
}
async function connectSync(repoRaw, token, pass) {
  const repo = repoRaw.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) throw fail('레포는 "아이디/레포이름" 모양으로 적어 주세요.');
  if (!token.trim()) throw fail('열쇠(토큰)를 붙여 넣어 주세요.');
  if (pass.length < 8) throw fail('암호 비밀번호는 8자 이상으로 정해 주세요.');
  const cfg = { repo, token: token.trim() };
  const info = await gh('GET', '', null, cfg);
  if (!info.private) throw fail('이 레포는 공개 레포예요. 카드 데이터는 비공개 레포에만 올릴게요.');
  cfg.branch = info.default_branch;
  try { await gh('GET', '/git/ref/heads/' + encodeURIComponent(cfg.branch), null, cfg); }
  catch (e) { if (e.status === 404 || e.status === 409) throw fail('레포가 비어 있어요. README 파일을 하나 만든 뒤 다시 연결해 주세요.'); throw e; }
  let meta = null;
  try { const f = await gh('GET', '/contents/meta.json?ref=' + encodeURIComponent(cfg.branch), null, cfg); meta = JSON.parse(td.decode(unb64(f.content))); }
  catch (e) { if (e.status !== 404) throw e; }
  let key;
  if (meta) {
    if (meta.app !== 'person-cards' || !meta.salt || !meta.check) throw fail('다른 용도로 쓰는 레포 같아요. 카드첩 전용 레포를 골라 주세요.');
    key = await deriveKey(pass, unb64(meta.salt));
    let ok = false;
    try { ok = td.decode(await unseal(unb64(meta.check), key)) === 'collector-ok'; } catch (e) { ok = false; }
    if (!ok) throw fail('암호 비밀번호가 처음 정한 것과 달라요.');
  } else {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    key = await deriveKey(pass, salt);
    Sync.key = key;
    const body = { app: 'person-cards', v: 1, salt: b64(salt), check: b64(await seal(te.encode('collector-ok'))), note: '인물 카드첩 동기화 데이터. 카드와 사진은 모두 암호화되어 있어요.' };
    await gh('PUT', '/contents/meta.json', { message: '동기화 시작', content: b64(te.encode(JSON.stringify(body, null, 2))), branch: cfg.branch }, cfg);
  }
  cfg.key = b64(await crypto.subtle.exportKey('raw', key));
  Sync.cfg = cfg; Sync.key = key;
  Sync.state = { synced: {}, pendingCards: [], pendingImages: [], lastAt: 0 };
  await Store.putMeta('sync', cfg);
  await Store.putMeta('state', Sync.state);
}
async function disconnectSync() {
  clearTimeout(Sync.timer);
  Sync.cfg = null; Sync.key = null; Sync.state = null;
  await Store.delMeta('sync').catch(() => {});
  await Store.delMeta('state').catch(() => {});
  setSync('off');
}
async function loadSync() {
  try {
    const cfg = await Store.getMeta('sync');
    if (!cfg || !cfg.key) return;
    Sync.key = await crypto.subtle.importKey('raw', unb64(cfg.key), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
    Sync.cfg = cfg;
    Sync.state = Object.assign({ synced: {}, pendingCards: [], pendingImages: [], lastAt: 0 }, await Store.getMeta('state'));
    setSync('ok');
  } catch (e) { Sync.cfg = null; Sync.key = null; }
}
function openSyncSheet() { $('#syncScrim').hidden = false; renderSyncSheet(); }
function closeSyncSheet() { $('#syncScrim').hidden = true; }
function renderSyncSheet() {
  const sh = $('#syncSheet');
  if (sh.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;
  sh.textContent = '';
  const head = h('div', { class: 'thead' }, h('h2', { class: 'ttitle' }, '동기화 설정'), h('span', { class: 'grow' }), h('button', { class: 'btn sm', type: 'button', onclick: closeSyncSheet }, '닫기'));
  if (Sync.cfg) {
    const at = Sync.state && Sync.state.lastAt ? new Date(Sync.state.lastAt).toLocaleString('ko-KR') : '아직 없음';
    sh.append(head,
      h('dl', { class: 'kv' }, h('dt', null, '레포'), h('dd', null, `${Sync.cfg.repo} (${Sync.cfg.branch})`), h('dt', null, '마지막 동기화'), h('dd', null, at), h('dt', null, '암호화'), h('dd', null, '켜짐')),
      h('p', { class: 'ferr' }, Sync.lastError),
      h('p', { class: 'fhint' }, '앱을 열 때와 카드를 고치고 몇 초 뒤에 저절로 맞춰져요. 인터넷이 없을 때 고친 카드는 다음에 연결되면 올라가요.'),
      h('div', { class: 'actions' },
        confirmBtn('연결 끊기', '한 번 더 누르면 끊음', async () => { await disconnectSync(); renderSyncSheet(); toast('동기화를 껐어요. 이 기기의 카드는 그대로 있어요.'); }),
        h('span', { class: 'grow' }),
        h('button', { class: 'btn primary', type: 'button', onclick: () => runSync() }, Sync.running ? '동기화 중…' : '지금 동기화')));
    return;
  }
  const f = (id, label, attrs, hint) => h('div', { class: 'field' }, h('label', { for: id }, label), h('input', Object.assign({ id, class: 'in', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false' }, attrs)), hint ? h('p', { class: 'fhint' }, hint) : null);
  const err = h('p', { class: 'ferr', role: 'alert' });
  const go = h('button', { class: 'btn primary', type: 'submit' }, '연결하기');
  const form = h('form', { class: 'side', novalidate: true },
    f('s-repo', '비공개 레포', { placeholder: '아이디/collector-data' }),
    f('s-token', '열쇠 (토큰)', { type: 'password', placeholder: 'github_pat_…' }, '이 기기에만 저장돼요.'),
    f('s-pass', '암호 비밀번호', { type: 'password', autocomplete: 'new-password' }, '처음 연결할 때 정한 비밀번호를 다른 기기에서도 똑같이 넣어요. 잊으면 아무도 복구할 수 없으니 따로 적어 두세요.'),
    f('s-pass2', '암호 비밀번호 확인', { type: 'password', autocomplete: 'new-password' }),
    err,
    h('div', { class: 'actions' }, h('span', { class: 'grow' }), go));
  form.addEventListener('input', () => { err.textContent = ''; });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const repo = $('#s-repo').value, token = $('#s-token').value, pass = $('#s-pass').value;
    if (pass !== $('#s-pass2').value) { err.textContent = '두 비밀번호가 서로 달라요.'; return; }
    go.textContent = '연결하는 중…'; go.setAttribute('aria-disabled', 'true');
    try {
      await connectSync(repo, token, pass);
      document.activeElement && document.activeElement.blur();
      renderSyncSheet();
      toast('연결했어요. 카드를 맞추는 중이에요.');
      runSync();
    } catch (ex) {
      err.textContent = explain(ex);
      go.textContent = '연결하기'; go.removeAttribute('aria-disabled');
    }
  });
  sh.append(head, form);
}

/* ---------- 연결 ---------- */
function bindUI() {
  thumbObs = new IntersectionObserver(es => {
    for (const e of es) {
      if (!e.isIntersecting) continue;
      const im = e.target; thumbObs.unobserve(im);
      Urls.get('thumbs', im.dataset.id).then(u => { if (u) im.src = u; });
    }
  }, { root: $('#gridView'), rootMargin: '400px 0px' });
  moreObs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && cursor < S.visible.length) appendBatch(); }, { root: $('#gridView'), rootMargin: '600px 0px' });
  moreObs.observe($('#sentinel'));

  let qt;
  $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; renderGallery(); }, 120); });
  $('#newBtn').addEventListener('click', newCard);
  $('#tagBtn').addEventListener('click', () => openTags('filter'));
  $('#syncBtn').addEventListener('click', openSyncSheet);
  $('#syncScrim').addEventListener('click', e => { if (e.target === e.currentTarget) closeSyncSheet(); });
  window.addEventListener('online', () => scheduleSync(500));
  $('#tagScrim').addEventListener('click', e => { if (e.target === e.currentTarget) closeTags(); });
  $('#backBtn').addEventListener('click', showGrid);
  $('#prevBtn').addEventListener('click', () => step(-1));
  $('#nextBtn').addEventListener('click', () => step(1));
  $('#editBtn').addEventListener('click', () => S.editing ? exitEdit() : enterEdit());

  const menu = $('#menu'), mb = $('#menuBtn');
  const setMenu = open => { menu.hidden = !open; mb.setAttribute('aria-expanded', String(open)); };
  mb.addEventListener('click', e => { e.stopPropagation(); setMenu(menu.hidden); });
  document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    setMenu(false);
    const act = b.dataset.act;
    if (act === 'new') newCard();
    else if (act === 'seed') seedExamples();
    else if (act === 'export') exportAll();
    else if (act === 'sync') openSyncSheet();
    else if (act === 'import') { const f = $('#importFile'); f.value = ''; f.click(); }
  });
  $('#importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importFile(f); });

  $('#scrim').addEventListener('click', e => { if (e.target === e.currentTarget) closeSheet(); });

  const stage = $('#stage');
  let sx = 0, sy = 0, tracking = false, swiped = false;
  stage.addEventListener('pointerdown', e => {
    if (S.editing || (e.pointerType === 'mouse' && e.button !== 0)) return;
    sx = e.clientX; sy = e.clientY; tracking = true;
  });
  stage.addEventListener('pointerup', e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { swiped = true; step(dx < 0 ? 1 : -1); setTimeout(() => swiped = false, 80); }
  });
  stage.addEventListener('pointercancel', () => { tracking = false; });
  stage.addEventListener('click', e => { if (swiped) { e.stopPropagation(); e.preventDefault(); } }, true);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#syncScrim').hidden) { closeSyncSheet(); return; }
    if (e.key === 'Escape' && TP.mode) { if (TP.renaming) { TP.renaming = null; renderTagList(); } else closeTags(); return; }
    if (e.key === 'Escape' && S.sheet) { closeSheet(); return; }
    if ($('#cardView').hidden || S.sheet || S.editing || TP.mode) return;
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); else scheduleSync(500); });
  window.addEventListener('pagehide', flushAll);
}

async function boot() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  let list = [];
  try { list = await Store.allCards(); } catch (e) { list = []; }
  for (const c of list) { S.cards.set(c.id, c); addToIndex(c); }
  resort();
  $('#memNote').hidden = !Store.memory;
  await loadSync();
  bindUI();
  showGrid();
  scheduleSync(600);
}
boot();
})();
